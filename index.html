<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a50ada2e2f.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="background-image"> <img src="eva.jpg" alt="Background Image"> </div>
    <div class="profile-card">
        <div class="pfp">
            <img src="pfp.png" alt="Profile Picture" >
        </div>
        <div class="profile-info">

            <div class="name">
                <h2>Kartikeya Dhoundiyal</h2>
            </div>

            <div class="updates">
                <p>Currently studying JavaScript and python along with Deutsch </p>
            </div>

            <div class="line">
                <hr>
            </div>

            <div class="title">
                <p>Computer Science Student</p>
            </div>

            <div class="description">
                <p><strong>||PHILOMATH||</strong></p>
                <p>Pursuing degree in Computer Science</p>
            </div>
            
        </div>
        <div class="social-links">
            <a href="https://www.instagram.com/dh.krtikeya" target="_blank"><i class="fa-brands fa-instagram fa-float"></i></a>
            <a href="https://www.linkedin.com/in/kartikeya-dhoundiyal-a89b68412" target="_blank"><i class="fa-brands fa-linkedin fa-float"></i></a>
            <a href="https://github.com/FernInco" target="_blank"><i class="fa-brands fa-github fa-float"></i></a>
        </div>
    </div>
</body>
</html>
