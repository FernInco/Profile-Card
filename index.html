<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="pfp">
            <img src="pfp.png" alt="Profile Picture" >
        </div>
        <div class="profile-info">
            <h1>Kartikeya Dhoundiyal</h1>
            <p>Computer Science Student</p>
            <p>
                Hi, I'm Kartikeya Dhoundiyal, a total <strong>Philomath</strong>, which is a fancy way of saying I love learning new things. I'm currently pursuing my degree in Computer Science.
            </p>
            
        </div>
        <div class="social-links">
            <a href="https://instagram.com" target="_blank">Instagram</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
